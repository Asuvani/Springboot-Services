server:
  port: '8080'

spring:
  application:
    name: API-GATEWAY
  
  security:
    oauth2:
      resourceserver:
        jwt:
          public-key-location: classpath:public-key.pem


  cloud:
    gateway:
      discovery:
        locator:
          enabled: 'true'
          lower-case-service-id: 'true'
      routes:

        - id: registration-service
          uri: http://localhost:8081/
          predicates:
            - Path=/patients/**

        - id: appointment-service
          uri: http://localhost:8082/
          predicates:
            - Path=/appointments/**
        
        - id: email-service
          uri: http://localhost:8083/
          predicates:
            - Path=/email/**
        
        - id: auth-service
          uri: http://localhost:8085/
          predicates:
            - Path=/auth/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    hostname: localhost

resilience4j:
  ratelimiter:
    instances:
      gatewayRateLimiter:
        limitForPeriod: 10
        limitRefreshPeriod: 1s
        timeoutDuration: 0

  