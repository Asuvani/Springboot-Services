spring:
  application:
    name: API-GATEWAY

  security:
    oauth2:
      resourceserver:
        jwt:
          public-key-location: classpath:public-key.pem

  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: registration-service
          uri: lb://REGISTRATION-SERVICE
          predicates:
            - Path=/patients/**

        - id: appointment-service
          uri: lb://APPOINTMENT-SERVICE
          predicates:
            - Path=/appointments/**

        - id: email-service
          uri: lb://EMAIL-SERVICE
          predicates:
            - Path=/email/**

        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/auth/**

# Include trace ID and span ID in logs
logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level [${spring.application.name}] [traceId=%X{traceId}, spanId=%X{spanId}] %logger - %msg%n"

# Sampling probability
management:
  tracing:
    sampling:
      probability: 1.0