server:
  port: '8083'
spring:
  application:
    name: EMAIL-SERVICE
  mail:
    properties:
      mail:
        smtp:
          starttls:
            enable: 'true'
          auth: 'true'
    host: smtp.gmail.com
    username: your_email@gmail.com
    password: your_app_password
    port: '587'
eureka:
  client:
    instance:
      prefer-ip-address: 'true'
    service-url:
      defaultZone: http://localhost:8761/eureka/    
